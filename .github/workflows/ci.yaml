name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.x"

jobs:
  generate-and-format:
    name: Generate and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run make generate
        run: make generate

      - name: Run make fmt
        run: make fmt

      - name: Check for changes
        run: |
          if ! git diff --quiet; then
            echo "Files have been modified by generate or fmt:"
            git diff --name-only
            git diff
            echo "Please run 'make generate && make fmt' and commit the changes."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run golangci-lint
        run: make lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run unit tests with coverage
        run: make test-coverage

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.out

  build-container:
    name: Build Container (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64, s390x, ppc64le]
    # Only build on pull requests, not on pushes to main
    # (main pushes are handled by release.yaml with multi-arch builds)
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: default-load=true

      - name: Build container image
        env:
          GOARCH: ${{ matrix.arch }}
          CONTAINER_TOOL: docker buildx
          IMAGE_NAME: dra-driver-sriov
          VERSION: ci
        run: make -C deployments/container centos9

      - name: Verify image and driver architectures
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' dra-driver-sriov:ci)" = "linux/$EXPECTED_ARCH"
          container=$(docker create --platform "linux/$EXPECTED_ARCH" dra-driver-sriov:ci /bin/true)
          trap 'docker rm "$container"' EXIT
          docker cp "$container:/usr/bin/dra-driver-sriov" ./dra-driver-sriov
          case "$EXPECTED_ARCH" in
            amd64) machine="Advanced Micro Devices X86-64" ;;
            arm64) machine="AArch64" ;;
            s390x) machine="IBM S/390" ;;
            ppc64le) machine="PowerPC64" ;;
          esac
          readelf -h ./dra-driver-sriov
          readelf -h ./dra-driver-sriov | grep -E "Machine: +$machine$"
