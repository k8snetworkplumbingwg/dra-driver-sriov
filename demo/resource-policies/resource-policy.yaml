# Administrator setup: policy, attributes, DeviceClasses and NADs below require
# administrator credentials. NADs live in the protected dra-driver-sriov namespace.
# Tenant claims/templates contain requests only; they cannot supply SR-IOV config.
# The driver release namespace must already exist; adjust admin namespace references
# together if the driver was installed elsewhere.
# DeviceAttributes define extra attributes applied to devices matched by a policy config.
# Policies reference DeviceAttributes via label selectors.
apiVersion: sriovnetwork.k8snetworkplumbingwg.io/v1alpha1
kind: DeviceAttributes
metadata:
  name: eth0-attrs
  namespace: dra-driver-sriov
  labels:
    pool: eth0-resource
spec:
  attributes:
    sriovnetwork.k8snetworkplumbingwg.io/resourceName:
      string: "eth0_resource"
---
apiVersion: sriovnetwork.k8snetworkplumbingwg.io/v1alpha1
kind: DeviceAttributes
metadata:
  name: eth1-attrs
  namespace: dra-driver-sriov
  labels:
    pool: eth1-resource
spec:
  attributes:
    sriovnetwork.k8snetworkplumbingwg.io/resourceName:
      string: "eth1_resource"
---
apiVersion: sriovnetwork.k8snetworkplumbingwg.io/v1alpha1
kind: SriovResourcePolicy
metadata:
  name: example-resource-policy
  namespace: dra-driver-sriov
spec:
  # NodeSelector to match SR-IOV-capable nodes (uses v1.NodeSelector).
  # Omit or leave empty to match all nodes.
  nodeSelector:
    nodeSelectorTerms:
    - matchExpressions:
      - key: feature.node.kubernetes.io/network-sriov.capable
        operator: In
        values:
        - "true"
  # Configs define multiple resource configurations
  configs:
  - # First config for eth0 device
    deviceAttributesSelector:
      matchLabels:
        pool: eth0-resource
    resourceFilters:
    - vendors: ["8086"]
      pfNames: ["eth0"]
      # Filter by PF PCI addresses (optional)
      # pfPciAddresses: ["0000:01:00.0"]
      # Filter by driver names (optional)
      # drivers: ["vfio-pci", "igb_uio"]
      # Filter by NIC link type (optional): "eth", "ib", "ethernet", or "infiniband"
      # linkType: eth
  - # Second config for eth1 device
    deviceAttributesSelector:
      matchLabels:
        pool: eth1-resource
    resourceFilters:
    - vendors: ["8086"]
      pfNames: ["eth1"]
---
apiVersion: v1
kind: Namespace
metadata:
  name: vf-test4
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: "demo-resource-policies-net"
  namespace: "dra-driver-sriov"
spec:
  config: |-
    {
        "cniVersion": "1.0.0",
        "name": "demo-resource-policies-net",
        "type": "sriov",
        "vlan": 0,
        "spoofchk": "on",
        "trust": "on",
        "vlanQoS": 0,
        "logLevel": "info",
        "ipam": {
            "type": "host-local",
            "ranges": [
                [
                    {
                        "subnet": "10.0.1.0/24"
                    }
                ]
            ]
        }
    }
---
# Administrator-owned class: tenant claims select this configuration.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: demo-resource-policies
spec:
  selectors:
  - cel:
      expression: device.driver == 'sriovnetwork.k8snetworkplumbingwg.io'
  - cel:
      expression: has(device.attributes["sriovnetwork.k8snetworkplumbingwg.io"].resourceName) && device.attributes["sriovnetwork.k8snetworkplumbingwg.io"].resourceName == "eth1_resource"
  config:
  - opaque:
      driver: sriovnetwork.k8snetworkplumbingwg.io
      parameters:
        apiVersion: sriovnetwork.k8snetworkplumbingwg.io/v1alpha1
        kind: VfConfig
        ifName: net1
        netAttachDefName: demo-resource-policies-net
        netAttachDefNamespace: dra-driver-sriov
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  namespace: vf-test4
  name: single-vf
spec:
  spec:
    devices:
      requests:
      - name: vf
        exactly:
          deviceClassName: "demo-resource-policies"
          count: 1
---
apiVersion: v1
kind: Pod
metadata:
  namespace: vf-test4
  name: pod0
  labels:
    app: pod
spec:
  terminationGracePeriodSeconds: 2
  containers:
  - name: ctr0
    image: quay.io/schseba/toolbox:latest
    command:
      - /bin/bash
      - -c
      - sleep INF
    securityContext:
      runAsUser: 0
      allowPrivilegeEscalation: true
      capabilities:
        add:
          - NET_ADMIN
          - NET_RAW
    resources:
      claims:
      - name: vf
  resourceClaims:
  - name: vf
    resourceClaimTemplateName: single-vf
