# Administrator setup: policy, attributes, DeviceClasses and NADs below require
# administrator credentials. NADs live in the protected dra-driver-sriov namespace.
# Tenant claims/templates contain requests only; they cannot supply SR-IOV config.
# The driver release namespace must already exist; adjust admin namespace references
# together if the driver was installed elsewhere.
# DeviceAttributes define extra attributes applied to devices matched by a policy config.
# Policies reference DeviceAttributes via label selectors.
apiVersion: sriovnetwork.k8snetworkplumbingwg.io/v1alpha1
kind: DeviceAttributes
metadata:
  name: sriov-vf-attrs
  namespace: dra-driver-sriov
  labels:
    pool: sriov_vf
spec:
  attributes:
    k8s.cni.cncf.io/resourceName:
      string: "sriov_nic_1"
---
apiVersion: sriovnetwork.k8snetworkplumbingwg.io/v1alpha1
kind: SriovResourcePolicy
metadata:
  name: sriov-vf-policy
  namespace: dra-driver-sriov
spec:
  # NodeSelector to match specific nodes (uses v1.NodeSelector)
  # Omit or leave empty to match all nodes
  # Configs define multiple resource configurations
  configs:
  - deviceAttributesSelector:
      matchLabels:
        pool: sriov_vf
    resourceFilters:
    - {}
---
apiVersion: v1
kind: Namespace
metadata:
  name: vf-test8
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: "demo-multus-multiple-net"
  namespace: "dra-driver-sriov"
  annotations:
    k8s.v1.cni.cncf.io/resourceName: sriov_nic_1
spec:
  config: |-
    {
        "cniVersion": "1.0.0",
        "name": "demo-multus-multiple-net",
        "type": "sriov",
        "vlan": 0,
        "spoofchk": "on",
        "trust": "on",
        "vlanQoS": 0,
        "logLevel": "info",
        "ipam": {
            "type": "host-local",
            "ranges": [
                [
                    {
                        "subnet": "10.0.2.0/24"
                    }
                ]
            ]
        }
    }
---
# Administrator-owned class: tenant claims select this configuration.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: demo-multus-multiple-vf
spec:
  selectors:
  - cel:
      expression: device.driver == 'sriovnetwork.k8snetworkplumbingwg.io'
  - cel:
      expression: has(device.attributes['k8s.cni.cncf.io'].resourceName) && device.attributes['k8s.cni.cncf.io'].resourceName == 'sriov_nic_1'
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  namespace: vf-test8
  name: vf-test8
spec:
  spec:
    devices:
      requests:
      - name: vf
        exactly:
          deviceClassName: "demo-multus-multiple-vf"
          count: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: vf-test8
  name: pod0
  labels:
    app: pod0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod0
  template:
    metadata:
      labels:
        app: pod0
      annotations:
        k8s.v1.cni.cncf.io/networks: "dra-driver-sriov/demo-multus-multiple-net,dra-driver-sriov/demo-multus-multiple-net"
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: ctr0
        image: quay.io/schseba/toolbox:latest
        command:
          - /bin/bash
          - -c
          - sleep INF
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: true
          capabilities:
            add:
              - NET_ADMIN
              - NET_RAW
        resources:
          claims:
          - name: sriov
      resourceClaims:
      - name: sriov
        resourceClaimTemplateName: vf-test8
