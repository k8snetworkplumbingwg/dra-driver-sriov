# Administrator setup: policy, attributes, DeviceClasses and NADs below require
# administrator credentials. NADs live in the protected dra-driver-sriov namespace.
# Tenant claims/templates contain requests only; they cannot supply SR-IOV config.
# The driver release namespace must already exist; adjust admin namespace references
# together if the driver was installed elsewhere.
# Advertise all SR-IOV devices on all nodes (required for device discovery).
# Adjust namespace to match the driver's Helm release namespace.
apiVersion: sriovnetwork.k8snetworkplumbingwg.io/v1alpha1
kind: SriovResourcePolicy
metadata:
  name: all-devices
  namespace: dra-driver-sriov
spec:
  configs:
  - {}
---
apiVersion: v1
kind: Namespace
metadata:
  name: vf-test3
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: "demo-multiple-vf-net"
  namespace: "dra-driver-sriov"
spec:
  config: |-
    {
        "cniVersion": "1.0.0",
        "name": "demo-multiple-vf-net",
        "type": "sriov",
        "vlan": 0,
        "spoofchk": "on",
        "trust": "on",
        "vlanQoS": 0,
        "logLevel": "info",
        "ipam": {
            "type": "host-local",
            "ranges": [
                [
                    {
                        "subnet": "10.0.1.0/24"
                    }
                ]
            ]
        }
    }
---
# Administrator-owned class: tenant claims select this configuration.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: demo-multiple-vf
spec:
  selectors:
  - cel:
      expression: device.driver == 'sriovnetwork.k8snetworkplumbingwg.io'
  config:
  - opaque:
      driver: sriovnetwork.k8snetworkplumbingwg.io
      parameters:
        apiVersion: sriovnetwork.k8snetworkplumbingwg.io/v1alpha1
        kind: VfConfig
        netAttachDefName: demo-multiple-vf-net
        netAttachDefNamespace: dra-driver-sriov
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  namespace: vf-test3
  name: multiple-vf
spec:
  spec:
    devices:
      requests:
      - name: vf
        exactly:
          deviceClassName: "demo-multiple-vf"
          count: 2
---
apiVersion: v1
kind: Pod
metadata:
  namespace: vf-test3
  name: pod0
  labels:
    app: pod
spec:
  terminationGracePeriodSeconds: 2
  containers:
  - name: ctr0
    image: quay.io/schseba/toolbox:latest
    command:
      - /bin/bash
      - -c
      - sleep INF
    securityContext:
      runAsUser: 0
      allowPrivilegeEscalation: true
      capabilities:
        add:
          - NET_ADMIN
          - NET_RAW
    resources:
      claims:
      - name: vf
  resourceClaims:
  - name: vf
    resourceClaimTemplateName: multiple-vf
